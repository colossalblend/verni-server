name: build-worker

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build-worker.yml']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch iOSAuthRuntime
        shell: cmd
        run: git clone --depth 1 https://github.com/iOS-Auth/iOSAuthRuntime iOSAuthRuntime

      - name: Fetch iOSAuthSingle
        shell: cmd
        run: git clone --depth 1 https://github.com/iOS-Auth/iOSAuthSingle iOSAuthSingle

      - name: Patch Exec.cpp to read DSID at runtime (dsid.txt next to exe)
        shell: pwsh
        run: |
          python tools/patch_runtime.py iOSAuthRuntime/Exec.cpp
          if ($LASTEXITCODE -ne 0) { Write-Error 'runtime-dsid patch failed'; exit 1 }

      - uses: microsoft/setup-msbuild@v2

      - name: Build runtime + single (Win32 Release, toolset v143)
        shell: cmd
        run: |
          msbuild iOSAuthRuntime\iOSAuthRuntime.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:SolutionDir="%GITHUB_WORKSPACE%\\"
          if errorlevel 1 exit /b 1
          msbuild iOSAuthSingle\iOSAuthSingle.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:SolutionDir="%GITHUB_WORKSPACE%\\"
          if errorlevel 1 exit /b 1

      - name: Collect worker artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem -Recurse -Include iOSAuthRuntime.dll,iOSAuthSingle.exe,iOSAuthRuntime.lib | ForEach-Object {
            Copy-Item $_.FullName -Destination dist -Force
          }
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: verni-worker-Win32
          path: dist
          if-no-files-found: error
